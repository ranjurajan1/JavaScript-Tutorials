<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1 id="demo">My Website</h1>

    <script>
     // Change the content of the <h1> element with id="demo"
      document.getElementById("demo").innerHTML = 'name changed';

     //change the color of the <h1> element with id="demo"
      document.getElementById ("demo").style.color = "red";

      //change the font size of the <h1> element with id="demo"
      document.getElementById("demo").style.fontSize= "70px";

      //change the background color of the <h1> element with id="demo"
      document.getElementById("demo").style.backgroundColor = "Yellow";

    </script>
    
</body>
