<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1 id="header"> Test </h1>
    <img src="img.jpg" id="image" width="500px" height="500px">
    <script>

//Style Manipulation

        //change the content of the <h1> element with id="header"
        document.getElementById("header").innerHTML = "My Website";

        //change the color of the <h1> element with id="header"
        document.getElementById("header").style.color = "red";

        //change the font size of the <h1> element with id="header"
        document.getElementById("header").style.fontSize = "100px";

        //change the background color of the <h1> element with id="header"
        document.getElementById("header").style.fontFamily = "Arial";

        //change the background color of the <h1> element with id="header"
        document.getElementById("header").style.backgroundColor ="yellow";

    </script>

</body>
</html>
